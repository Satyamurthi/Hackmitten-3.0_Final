# This file is included from nginx http {} (for example sites-enabled).
limit_req_zone $binary_remote_addr zone=hackmitten_login_v3:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hackmitten_recovery_v3:10m rate=3r/m;

# ----------------------------------------------------------------------
# Frontend Server Block
# ----------------------------------------------------------------------
server {
  listen 80;
  server_name hackmitten-3-0.mitt.edu.in;
  include /etc/nginx/mime.types;

  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  location / {
    root /home/mitt/apps/frontend/out;
    index index.html;
    try_files $uri $uri.html $uri/ =404;
  }

  location /_next/static/ {
    root /home/mitt/apps/frontend/out;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

# ----------------------------------------------------------------------
# Backend API Server Block
# ----------------------------------------------------------------------
server {
  listen 80;
  server_name hackmitten-3-0-api.mitt.edu.in;

  location = /api/auth/callback/credentials {
    limit_req zone=hackmitten_login_v3 burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/admin/credentials {
    limit_req zone=hackmitten_recovery_v3 burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '$http_origin' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token' always;
      add_header 'Access-Control-Max-Age' 86400;
      add_header 'Content-Type' 'text/plain; charset=utf-8';
      add_header 'Content-Length' 0;
      return 204;
    }

    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-CSRF-Token' always;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

